# Curated semantic context layered on top of the warehouse schema.
# Describes what tables and columns contain (meaning, units, grain, time basis).
# It deliberately contains no KPI formulas: metric definitions are owned by the business.

model:
  name: lucero
  description: >-
    Lucero company data warehouse (DuckDB), synced nightly from Adjust (attribution), App Store
    Connect (Apple sales, subscriptions, analytics, reviews) and RevenueCat (subscription metrics).
    Apps are identified across vendors through core.apps.
  instructions: >-
    Each dataset's `source` is the warehouse table to query. Money is USD unless a column says
    otherwise. Adjust and RevenueCat days are UTC; App Store days are Pacific time.
    Company convention (stated by the business): everything is analyzed on an install-cohort basis.
    "Cohorted revenue" for a date means the total revenue generated by users who installed the app
    on that date, starting from their install date. "Cohorted revenue D7" means the revenue
    generated by users who installed on that date within the first 7 days after installation.
    Install-cohort revenue lives in adjust.cohorts; tables that attribute revenue to the day it
    occurred (adjust.daily, core.app_daily, revenuecat.chart_points revenue) are not this basis.

datasets:
  core.apps:
    primary_key: [app_id]
    unique_keys: [[adjust_token], [apple_id], [rc_app], [sku]]
    synonyms: [app list, app mapping, app identity, app ids]
    fields:
      app_id: { description: "Lucero app key, lowercase app name without spaces, synonyms: [app]" }
      adjust_token: { description: "The app's id in Adjust" }
      apple_id: { description: "Numeric App Store id of the app" }
      sku: { description: "Apple product SKU of the app; in-app purchases point to it via appstore.sales.parent_identifier" }
      rc_app: { description: "RevenueCat project slug, null when the app has no RevenueCat key configured" }

  core.app_daily:
    synonyms: [daily KPIs, app overview, cross-vendor daily, app performance]
    instructions: >-
      One row per app_id and date combining vendors. Its revenue columns are by event date, not the
      company's install-cohort basis (see adjust.cohorts). installs, ad_spend, ad_revenue, adjust_iap_revenue,
      sessions and daus come from Adjust (UTC); rc_revenue, mrr, active_subscriptions, new_trials and
      new_customers from RevenueCat (UTC); app_store_downloads from Apple (Pacific day). mrr,
      active_subscriptions and daus are point-in-time values for the date.
    fields:
      ad_spend: { synonyms: [spend, ad spend, UA cost, media cost] }
      rc_revenue: { description: "RevenueCat revenue (gross purchases and renewals minus refunds), USD" }
      adjust_iap_revenue: { description: "In-app purchase revenue tracked by the Adjust SDK, USD" }
      app_store_downloads: { description: "First-time App Store downloads from Apple sales reports" }

  adjust.apps:
    synonyms: [Adjust apps]

  adjust.daily:
    synonyms: [attribution, user acquisition, UA, campaign performance, ad spend, installs by campaign, media source performance]
    instructions: >-
      Revenue columns are attributed to the day the revenue occurred (event date), not to the
      install date, so they are not the company's install-cohort revenue basis. For revenue by
      install cohort use adjust.cohorts.
    fields:
      partner: { synonyms: [ad network, network, media source, channel], description: "Ad network, or Organic" }
      campaign: { description: "Campaign name as reported by the ad network, with the network's campaign id in parentheses" }
      country: { description: "ISO 3166-1 alpha-2 country code, lowercase" }
      cost: { synonyms: [spend, ad spend, UA cost, media cost], description: "Ad spend recorded by Adjust, USD" }
      network_cost: { description: "Ad spend reported by the ad network API, USD" }
      installs: { synonyms: [attributed installs, new users] }
      iap_revenue: { synonyms: [IAP revenue, purchase revenue], description: "In-app purchase revenue tracked by the Adjust SDK, USD" }
      ad_revenue: { synonyms: [ads revenue, monetization revenue], description: "Revenue from ads shown in the app, USD" }
      all_revenue: { description: "iap_revenue plus ad_revenue, USD" }

  adjust.cohorts:
    synonyms: [revenue, app revenue, revenue by app, daily revenue, revenue by date, cohorted revenue, cohort revenue, install cohort, cohorted revenue D7, D7 revenue, LTV, W0, D30 revenue, cohorted ROAS inputs]
    instructions: >-
      Revenue columns are attributed to the INSTALL date. *_dN is cumulative revenue from users who
      installed on `date`, earned from the install day through N days after it. For recent install
      dates the window has not fully elapsed, so those values are still accumulating.
    fields:
      iap_revenue_d0: { synonyms: [day 0 revenue, D0], description: "IAP revenue on the install day" }
      iap_revenue_d3: { synonyms: [D3], description: "IAP revenue from install day through day 3 (first 4 days)" }
      iap_revenue_d6: { synonyms: [W0, week 0, first week, first 7 days, cohorted revenue D7], description: "IAP revenue from install day through day 6 (first 7 days); Adjust revenue_total_d6" }
      iap_revenue_d13: { synonyms: [W1 cumulative, first 14 days], description: "IAP revenue from install day through day 13" }
      iap_revenue_d29: { synonyms: [D30, first 30 days, month 0], description: "IAP revenue from install day through day 29" }
      all_revenue_d6: { synonyms: [W0 incl ads], description: "IAP plus ad revenue from install day through day 6" }
      cost: { synonyms: [spend, ad spend], description: "Ad spend on the install date, USD" }
      iap_revenue_to_date: { synonyms: [cohorted revenue, total cohort revenue, revenue to date, cohort LTV to date] }
      all_revenue_to_date: { synonyms: [cohorted revenue incl ads, total cohort revenue incl ads] }
      iap_revenue_d1: { synonyms: [D1 revenue] }
      iap_revenue_d7: { synonyms: [D7 revenue, cohorted revenue D7] }
      iap_revenue_d14: { synonyms: [D14 revenue] }
      iap_revenue_d30: { synonyms: [D30 revenue] }

  adjust.app_daily:
    synonyms: [DAU, WAU, MAU, active users]
    instructions: Active-user counts are point-in-time values per date.

  adjust.retention:
    synonyms: [retention, retention rate, D1 retention, D7 retention, D30 retention]
    instructions: >-
      retained_users_dN counts users from the install cohort still active N days after install;
      cohort_size_dN counts the cohort users old enough to be measured at day N.

  adjust.skan:
    synonyms: [SKAdNetwork, SKAN, iOS privacy attribution, conversion value]

  adjust.creatives:
    synonyms: [creative performance, ad creative, ad group, ad set, creative level]
    instructions: Same metrics as adjust.daily at ad group and creative level, without a country breakdown.

  appstore.apps:
    synonyms: [App Store apps, Apple apps]

  appstore.sales:
    synonyms: [App Store sales, Apple sales, Sales and Trends, proceeds, units, app downloads]
    instructions: >-
      developer_proceeds and customer_price are amounts PER UNIT, in proceeds_currency and
      customer_currency respectively (dozens of currencies, not USD). units is negative for refunds.
      App download rows carry the app's Apple id in apple_id; in-app purchase rows carry the parent
      app's SKU in parent_identifier. Dates are Pacific time. For USD proceeds see
      appstore.analytics_purchases.proceeds_usd.
    fields:
      product_type: { description: "Apple product type id: 1/1F/1T/F1 app download, 3/3F/3T/F3 redownload, 7/7F/7T/F7 update, IA*/FI1 in-app purchase or subscription" }
      developer_proceeds: { description: "Developer proceeds per unit after Apple's commission, in proceeds_currency" }
      customer_price: { description: "Price paid per unit, in customer_currency" }
      parent_identifier: { description: "For in-app purchases, the SKU of the parent app" }

  appstore.sales_yearly:
    synonyms: [yearly sales, historical Apple sales]
    instructions: Yearly version of appstore.sales for years older than Apple's 365-day daily window; same per-unit and currency rules.

  appstore.subscriptions:
    synonyms: [App Store active subscriptions, Apple active subscriptions, active subscriptions, Apple subscribers, subscription snapshot, billing retry, grace period, active trials]
    instructions: Point-in-time snapshot of active subscriptions at the end of report_date (Pacific).

  appstore.subscription_events:
    synonyms: [subscription events, trial starts, trial conversions, renewals, cancellations, refunds, churn events]
    instructions: Daily counts of subscription events in `quantity`; `event` names the event type.

  appstore.subscriber_events:
    synonyms: [subscriber level, per subscriber transactions]
    instructions: One row per anonymised subscriber transaction (Apple SUBSCRIBER report).

  appstore.reviews:
    synonyms: [reviews, ratings, stars, user feedback, customer reviews]

  appstore.analytics_engagement:
    synonyms: [App Store impressions, product page views, store visits, discovery, App Store funnel]
  appstore.analytics_downloads:
    synonyms: [downloads, first-time downloads, redownloads, download source]
  appstore.analytics_installs:
    synonyms: [Apple installs, deletions, app deletions]
  appstore.analytics_sessions:
    synonyms: [sessions, usage, session duration, engagement time]
  appstore.analytics_purchases:
    synonyms: [Apple purchases, proceeds in USD, paying users, IAP purchases]
    fields:
      proceeds_usd: { synonyms: [Apple proceeds USD], description: "Developer proceeds converted to USD by Apple" }
      sales_usd: { description: "Customer sales amount converted to USD by Apple" }
  appstore.analytics_crashes:
    synonyms: [crashes, stability, crash rate inputs]
  appstore.analytics_instances:
    instructions: Bookkeeping for Apple analytics report instances; not business data.

  revenuecat.projects:
    synonyms: [RevenueCat projects]

  revenuecat.chart_points:
    synonyms: [RevenueCat, MRR, ARR, RevenueCat revenue, RevenueCat active subscriptions, trials, new trials, churn, new customers, refunds]
    instructions: >-
      Long format: one row per app, chart, measure, segment and date. Rows with segment_by = ''
      are the total; other rows break the same value down by segment_by (country, store, ...),
      with 'Other' for the long tail. mrr, arr, actives and trials are point-in-time values per
      date. Money is USD, days are UTC.
    fields:
      chart: { description: "RevenueCat chart id, e.g. revenue, mrr, arr, actives, actives_new, trials, trials_new, churn, customers_new, refunds" }
      measure: { description: "Snake-case measure name within the chart, e.g. revenue, transactions, mrr, actives, new_trials, churn_rate" }
      segment_by: { description: "Breakdown dimension; '' for the total row" }

  revenuecat.cohort_points:
    synonyms: [RevenueCat cohorts, subscription retention, LTV curve, trial conversion cohorts]

  revenuecat.overview:
    synonyms: [RevenueCat overview, current MRR snapshot, dashboard snapshot]
    instructions: Snapshot of RevenueCat's overview metrics as of snapshot_date.

  meta.sync_runs:
    synonyms: [sync log, ingestion runs]
  meta.coverage:
    synonyms: [data coverage, date range, freshness]
  meta.freshness:
    synonyms: [last sync, data freshness, stale data]

# from dataset . from columns -> to dataset . to columns (to side is the unique side)
relationships:
  - [adjust.apps, [app_token], core.apps, [adjust_token]]
  - [adjust.daily, [app_token], core.apps, [adjust_token]]
  - [adjust.cohorts, [app_token], core.apps, [adjust_token]]
  - [adjust.app_daily, [app_token], core.apps, [adjust_token]]
  - [adjust.retention, [app_token], core.apps, [adjust_token]]
  - [adjust.skan, [app_token], core.apps, [adjust_token]]
  - [adjust.creatives, [app_token], core.apps, [adjust_token]]
  - [appstore.apps, [apple_id], core.apps, [apple_id]]
  - [appstore.sales, [parent_identifier], core.apps, [sku]]
  - [appstore.subscriptions, [app_apple_id], core.apps, [apple_id]]
  - [appstore.subscription_events, [app_apple_id], core.apps, [apple_id]]
  - [appstore.subscriber_events, [app_apple_id], core.apps, [apple_id]]
  - [appstore.reviews, [app_apple_id], core.apps, [apple_id]]
  - [appstore.analytics_engagement, [app_apple_id], core.apps, [apple_id]]
  - [appstore.analytics_downloads, [app_apple_id], core.apps, [apple_id]]
  - [appstore.analytics_installs, [app_apple_id], core.apps, [apple_id]]
  - [appstore.analytics_sessions, [app_apple_id], core.apps, [apple_id]]
  - [appstore.analytics_purchases, [app_apple_id], core.apps, [apple_id]]
  - [appstore.analytics_crashes, [app_apple_id], core.apps, [apple_id]]
  - [revenuecat.projects, [app], core.apps, [rc_app]]
  - [revenuecat.chart_points, [app], core.apps, [rc_app]]
  - [revenuecat.cohort_points, [app], core.apps, [rc_app]]
  - [revenuecat.overview, [app], core.apps, [rc_app]]
  - [core.app_daily, [app_id], core.apps, [app_id]]
